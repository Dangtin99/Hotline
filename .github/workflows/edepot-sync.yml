name: eDepot Sync to Supabase (Manual Dispatch Only)

on:
  # Đã tắt lịch tự động chạy schedule trên GitHub Actions theo yêu cầu.
  # Toàn bộ việc đồng bộ định kỳ giờ đây do Cron Job phụ trách độc quyền.
  workflow_dispatch: # Cho phép nhấn nút "Run workflow" trên giao diện GitHub khi cần test thủ công
    inputs:
      customFrom:
        description: 'Ngày giờ bắt đầu (YYYY-MM-DD HH:mm:ss)'
        required: false
        default: ''
      customTo:
        description: 'Ngày giờ kết thúc (YYYY-MM-DD HH:mm:ss)'
        required: false
        default: ''

jobs:
  sync-edepot:
    name: Sync eDepot to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install --omit=dev

      - name: Execute Hourly Sync
        env:
          EDEPOT_USERNAME: ${{ secrets.EDEPOT_USERNAME }}
          EDEPOT_PASSWORD: ${{ secrets.EDEPOT_PASSWORD }}
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
          SUPABASE_DATABASE: ${{ secrets.SUPABASE_DATABASE }}
          SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          CUSTOM_FROM: ${{ inputs.customFrom }}
          CUSTOM_TO: ${{ inputs.customTo }}
        run: |
          node scripts/cron-sync-edepot.js 2>&1 | tee sync_output.log
          EXIT_CODE=${PIPESTATUS[0]}
          exit $EXIT_CODE

      - name: Report Error in Annotations
        if: failure()
        run: |
          ERROR_TEXT=$(cat sync_output.log | tr '\r\n' ' ')
          echo "::error title=SyncLog::$ERROR_TEXT"

      - name: Upload Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-log
          path: sync_output.log
